[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "israel-scraping"
version = "0.3.0"
description = "Unofficial Python clients and CLI for Israeli listing sites: Yad2 and Madlan (real estate, cars)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "israel-scraping contributors" }]
keywords = ["yad2", "madlan", "israel", "real-estate", "scraper", "apartments", "cars", "listings", "nadlan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["curl_cffi>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
yad2 = "israel_scraping.cli:yad2_main"
madlan = "israel_scraping.cli:madlan_main"
israel-scraping = "israel_scraping.cli:all_main"

[project.urls]
Homepage = "https://github.com/Lomchat/israel-scraping"
Issues = "https://github.com/Lomchat/israel-scraping/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/israel_scraping"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["probe"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
